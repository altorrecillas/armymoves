<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="description" content="ARMY MOVES — Operación Delta. Réplica homenaje del clásico de Dinamic (1986).">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARMY MOVES — Operación Delta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="game" width="480" height="270"></canvas>
  </div>

  <!-- capa que captura todo el tacto durante la partida -->
  <div id="touchLayer" class="hidden"></div>

  <!-- joystick virtual flotante -->
  <div id="stick" class="hidden">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>

  <!-- botones de acción (solo visuales: la lógica vive en touchLayer) -->
  <div id="touchUI" class="hidden">
    <button id="btnFire" class="tbtn fire slot1" type="button">◉</button>
    <button id="btnJump" class="tbtn jump slot2" type="button">⬆</button>
    <button id="btnSpecial" class="tbtn special slot3" type="button">💣</button>
  </div>

  <button id="btnPause" class="hidden" type="button">⏸</button>
  <button id="btnHome" class="hidden" type="button">⌂</button>

  <div id="rotateOverlay">
    <div class="phone">📱</div>
    <p>GIRA EL DISPOSITIVO</p>
    <span>El juego se juega en horizontal</span>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/background.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
</body>
</html>
